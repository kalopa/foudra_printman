#
# Test every push and pull request, and check the packages still build.
# Releases are made by `make publish`, on the machine with the key.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check-tests
      - run: make deb
