#
# On a vX.Y.Z tag: test, build the .deb for each architecture, and
# attach them (with SHA256SUMS) to a GitHub release of that tag.
# Needs the repository variable DEB_MAINTAINER ("Name <address>").
#
name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test -race -count=1 ./...
      - name: Build packages
        run: make deb MAINTAINER="${{ vars.DEB_MAINTAINER }}"
      - name: Checksums
        run: cd bin/deb && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/deb/*.deb bin/deb/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
